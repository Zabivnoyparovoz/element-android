name: Build nnoxtgram APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Права для создания релиза

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Gradle Memory
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> ~/.gradle/gradle.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Rename app to nnoxtgram
        run: |
          find . -name "strings.xml" | xargs -r sed -i 's/>Element</>nnoxtgram</g'

      - name: Set default homeserver
        run: |
          find . -name "*.json" -path "*/assets/*" 2>/dev/null | xargs -r grep -l "matrix.org" 2>/dev/null | xargs -r sed -i 's|https://matrix.org|http://${{ secrets.SERVER_IP }}:8008|g' 2>/dev/null || true
          find . -name "*.json" -path "*/assets/*" 2>/dev/null | xargs -r grep -l "matrix.org" 2>/dev/null | xargs -r sed -i 's|"matrix.org"|"${{ secrets.SERVER_IP }}"|g' 2>/dev/null || true

      - name: Build APK
        run: ./gradlew :vector-app:assembleGplayDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nnoxtgram-APK
          path: vector-app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: nnoxtgram v1.0.${{ github.run_number }}
          files: vector-app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
